# Nginx reverse proxy for the Real-Time Location Tracker (Express + Socket.IO)
#
# Install:
#   sudo cp deploy/nginx/location-tracker.conf /etc/nginx/sites-available/location-tracker
#   sudo ln -s /etc/nginx/sites-available/location-tracker /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every "tracker.example.com" with your real domain.
#
# HTTPS IS REQUIRED: browsers only allow navigator.geolocation on secure
# origins (https:// or localhost). Over plain http:// on a server the map loads
# but no location is ever sent.

# Sets the Connection header for WebSocket upgrades (Socket.IO needs this).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream location_tracker {
    server 127.0.0.1:3000;   # must match PORT in ecosystem.config.js
    keepalive 16;
}

# --- HTTP: let certbot answer its challenge, redirect everything else to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name tracker.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # on nginx < 1.25.1 remove this line and use "listen 443 ssl http2;"
    server_name tracker.example.com;

    # Created by: sudo certbot certonly --nginx -d tracker.example.com   (see deploy/DEPLOYMENT.md step 4)
    ssl_certificate     /etc/letsencrypt/live/tracker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self)" always;

    client_max_body_size 1m;

    access_log /var/log/nginx/location-tracker.access.log;
    error_log  /var/log/nginx/location-tracker.error.log;

    # Socket.IO: WebSocket upgrade + long-lived connections
    location /socket.io/ {
        proxy_pass http://location_tracker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;   # keep idle sockets open (Socket.IO pings every 25s)
        proxy_send_timeout 3600s;
    }

    # Static files served directly by nginx (faster than Express)
    location ~ ^/(css|js|assets)/ {
        root /var/www/real-time-location-tracker/public;   # must match the app path on the server
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Everything else (the EJS page) goes to Node
    location / {
        proxy_pass http://location_tracker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
